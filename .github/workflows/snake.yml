name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # 12時間ごと
  workflow_dispatch:          # 手動実行
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0d1117&color_dots=#eef5fb,#c6e3fa,#a5d8ff,#6fa8dc,#3d6fa8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ffffff&color_dots=#161b22,#1e3a5f,#3d6fa8,#6fa8dc,#a5d8ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
